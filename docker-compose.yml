services:
  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment: ["GF_SECURITY_ADMIN_PASSWORD=admin"]
  loki:
    image: grafana/loki
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo
    ports: ["3200:3200"]
  alertmanager:
    image: prom/alertmanager
    ports: ["9093:9093"]
